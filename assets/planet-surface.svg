<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <filter id="land" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="5" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.45  0 0 0 0 0.34  3.2 0 0 0 -1.45"/>
  </filter>
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="4" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.9  0 0 0 0 0.84  2.6 0 0 0 -1.25"/>
  </filter>
  <rect width="800" height="400" fill="#1d2a30"/>
  <rect width="800" height="400" filter="url(#land)"/>
  <rect width="800" height="400" filter="url(#cloud)"/>
</svg>
